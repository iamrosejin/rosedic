<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rosedic</title>
<script>
(()=>{try{
  const mode=localStorage.getItem('rosedic-theme-v1');
  document.documentElement.dataset.theme=mode==='dark'?'dark':'light';
}catch(e){document.documentElement.dataset.theme='light';}})();
</script>
<style>

:root{
  --bg:#f7f7f5;
  --sidebar:#fbfbfa;
  --paper:#fff;
  --ink:#2f3437;
  --gray:#787774;
  --line:#e7e7e4;
  --hover:#f1f1ef;
  --active:#ececea;
  --danger:#b42318;
  --ui-size:16px;
  --wide:64px;
  --gap:16px;
  --button-gap:8px;
  --control-h:38px;
  --icon:16px;
  --stroke:2.2;
  --radius-control:8px;
  --radius-popup:12px;
  --radius-card:14px;
  --shadow-card:0 10px 30px rgba(0,0,0,.035);
  --shadow-popup:0 12px 38px rgba(0,0,0,.16);
}

*{box-sizing:border-box}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;
}

button,input{font:inherit}
button{color:inherit}
button:focus-visible{
  outline:2px solid rgba(47,52,55,.18);
  outline-offset:2px;
}
.hidden{display:none!important}

.app{
  display:grid;
  grid-template-columns:220px minmax(0,1fr);
  height:100vh;
  overflow:hidden;
}

.app.sidebar-collapsed{grid-template-columns:0 minmax(0,1fr)}
.app.sidebar-collapsed .sidebar{
  visibility:hidden;
  padding-left:0;
  padding-right:0;
  border-right:0;
}

/* Sidebar */
.sidebar{
  min-height:0;
  padding:16px 10px;
  background:var(--sidebar);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.brand{
  flex:0 0 var(--control-h);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 8px;
  color:var(--ink);
  font-size:var(--ui-size);
  font-weight:700;
}

.brand button,.close{
  width:28px;
  height:28px;
  padding:0;
  border:0;
  border-radius:var(--radius-control);
  background:transparent;
  color:var(--gray);
  display:grid;
  place-items:center;
  cursor:pointer;
}
.brand button:hover,.close:hover{background:var(--hover)}

.corner-icon{
  width:var(--icon);
  height:var(--icon);
  fill:none;
  stroke:currentColor;
  stroke-width:var(--stroke);
  stroke-linecap:round;
  stroke-linejoin:round;
}
.close .corner-icon{transform:rotate(45deg);transform-origin:center}

.pages{
  flex:1 1 auto;
  min-height:0;
  margin-top:6px;
  display:flex;
  flex-direction:column;
  gap:2px;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:thin;
}

.page{
  flex:0 0 62px;
  height:62px;
  padding:8px;
  border-radius:var(--radius-control);
  overflow:hidden;
  cursor:pointer;
  color:var(--gray);
  font-size:var(--ui-size);
  font-weight:400;
}
.page:hover{background:var(--hover)}
.page.active{background:var(--active);color:var(--ink)}

.page-title-label{
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  line-clamp:2;
  overflow:hidden;
  text-overflow:ellipsis;
  line-height:1.4;
  word-break:break-word;
  overflow-wrap:anywhere;
}

.side-actions{
  flex:0 0 auto;
  margin-top:12px;
  padding-top:8px;
  border-top:1px solid var(--line);
}
.side-actions button{
  width:100%;
  padding:8px;
  border:0;
  border-radius:var(--radius-control);
  background:transparent;
  text-align:left;
  color:var(--gray);
  font-size:var(--ui-size);
  font-weight:400;
  cursor:pointer;
}
.side-actions button:hover{background:var(--hover);color:var(--ink)}




.auth-modal{
  width:min(420px,calc(100vw - 32px));
}

.auth-subtitle{
  margin:0 0 16px;
  color:var(--gray);
  font-size:var(--ui-size);
  font-weight:400;
  line-height:1.6;
}

.password-field{
  position:relative;
  margin-top:8px;
}

.auth-password{
  margin-top:0;
  padding-right:48px;
}

.password-toggle{
  position:absolute;
  top:50%;
  right:6px;
  width:36px;
  height:36px;
  padding:0;
  border:0;
  border-radius:8px;
  background:transparent;
  color:var(--gray);
  display:grid;
  place-items:center;
  transform:translateY(-50%);
  cursor:pointer;
}

.password-toggle:hover{
  background:var(--hover);
  color:var(--ink);
}

.password-toggle:focus-visible{
  outline:2px solid rgba(55,53,47,.18);
  outline-offset:1px;
}

.eye-icon{
  width:18px;
  height:18px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.eye-closed{
  display:none;
}

.password-toggle.is-visible .eye-open{
  display:none;
}

.password-toggle.is-visible .eye-closed{
  display:block;
}

.auth-actions{
  margin-top:16px;
}

.auth-modal .modal-message{
  margin-top:12px;
}

.auth-modal .modal-message.error{
  color:var(--danger);
}

/* Main workspace */
.main{
  min-width:0;
  min-height:0;
  height:100vh;
  padding:var(--gap);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.toolbar{
  flex:0 0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:var(--button-gap);
  position:relative;
  margin-bottom:var(--gap);
}
.main:not(.has-video) .toolbar{
  width:calc((100% - var(--gap))/2);
  margin-left:auto;
  margin-right:auto;
}

/* In video mode, keep the toolbar aligned to the writing pane (right column),
   not to the video pane on the left. */
.main.has-video .toolbar{
  width:calc((100% - var(--gap))/2);
  margin-left:auto;
  margin-right:0;
}
.toolbar-left,.toolbar-actions{
  display:flex;
  align-items:center;
  gap:var(--button-gap);
}
.toolbar-actions{margin-left:auto}

.toolbar-left>button,.toolbar-actions>button{
  width:var(--control-h);
  min-width:var(--control-h);
  height:var(--control-h);
  padding:0;
  border:1px solid var(--line);
  border-radius:var(--radius-control);
  background:var(--paper);
  color:var(--gray);
  display:grid;
  place-items:center;
  flex:0 0 var(--control-h);
  font-size:var(--ui-size);
  font-weight:400;
  line-height:1;
  text-align:center;
  cursor:pointer;
}
.toolbar-left>button:hover,.toolbar-actions>button:hover{background:var(--hover)}

.sidebar-toggle svg,
.theme-toggle .theme-icon{
  width:var(--icon)!important;
  height:var(--icon)!important;
  display:block;
}
.theme-toggle .theme-icon{
  fill:none;
  stroke:currentColor;
  stroke-width:var(--stroke);
  stroke-linecap:round;
  stroke-linejoin:round;
}
.theme-toggle .contrast-half{
  fill:currentColor;
  stroke:none;
}

.emoji-action{
  font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif!important;
  font-size:16px!important;
  line-height:1!important;
  display:grid!important;
  place-items:center!important;
  text-align:center!important;
}

.toolbar svg,.icon svg,.chev svg,.stepper svg{
  width:var(--icon);
  height:var(--icon);
  fill:none;
  stroke:currentColor;
  stroke-width:var(--stroke);
  stroke-linecap:round;
  stroke-linejoin:round;
}

.workspace{
  flex:1 1 auto;
  min-height:0;
  width:100%;
  overflow:hidden;
}
.main:not(.has-video) .workspace{
  display:flex;
  justify-content:center;
  align-items:stretch;
}
.main.has-video .workspace{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:var(--gap);
  align-items:stretch;
}

/* Writing card */
.paper{
  --body-size:16px;
  --line-height:2.5;
  --title-size:38px;
  --title-weight:700;
  --theme-bottom-text:#AD1A72;
  --theme-bottom-bg:#F4DFEB;
  --theme-top-text:#6940A5;
  --theme-top-bg:#EAE4F2;

  width:100%;
  height:100%;
  min-height:0;
  padding:var(--wide);
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius-card);
  box-shadow:var(--shadow-card);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.main:not(.has-video) .paper{width:calc((100% - var(--gap))/2)}

#title{
  flex:0 0 auto;
  margin:0 0 24px;
  outline:none;
  white-space:pre-wrap;
  word-break:break-word;
  color:var(--ink);
  font-size:var(--title-size);
  font-weight:var(--title-weight);
  line-height:1.18;
}

#editor{
  flex:1 1 auto;
  min-height:0;
  padding:0;
  outline:none;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:thin;
  color:var(--ink);
  font-size:var(--body-size);
  font-weight:400;
  line-height:var(--line-height);
  text-align:justify;
  text-justify:inter-word;
  word-spacing:0;
  font-synthesis:none;
}
#editor p,#editor div{margin:0}

/* Annotations */
.annotation{
  display:inline-block;
  position:relative;
  vertical-align:baseline;
  padding:0;
  margin:0;
  line-height:1;
}
.annotation-text{
  display:inline;
  padding:0 1px;
  border-radius:3px;
  background:var(--theme-bottom-bg);
  cursor:pointer;
  line-height:1;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact;
}
.annotation-note{
  position:absolute;
  left:50%;
  top:calc(100% + 3px);
  z-index:4;
  max-width:420px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  transform:translateX(-50%) translateX(var(--note-shift,0px));
  color:var(--theme-bottom-text);
  cursor:pointer;
  font-family:inherit;
  font-size:calc(var(--body-size) - 2px);
  font-weight:400;
  font-style:normal;
  line-height:1.15;
  letter-spacing:normal;
  font-synthesis:none;
}
.annotation.note-above .annotation-note{
  top:auto;
  bottom:calc(100% + 3px);
  color:var(--theme-top-text);
}
.annotation.note-above .annotation-text{background:var(--theme-top-bg)}
.annotation.selected .annotation-text{
  outline:2px solid rgba(47,52,55,.2);
  outline-offset:2px;
}

/* Video */
.video-panel{display:none;width:100%;align-self:center}
.video-panel.show{display:block}
.video-frame{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:var(--radius-card);
  background:#000;
  box-shadow:var(--shadow-card);
}
.video-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.youtube-open-link{
  display:block;
  margin-top:8px;
  text-align:right;
  color:var(--gray);
  font-size:var(--ui-size);
  font-weight:400;
  text-decoration:none;
}
.youtube-open-link:hover{text-decoration:underline}

/* Settings */
.settings{
  position:absolute;
  right:0;
  top:46px;
  z-index:20;
  width:330px;
  padding:14px;
  display:none;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius-popup);
  box-shadow:var(--shadow-popup);
}
.settings.show{display:block}
.settings-head{
  height:40px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:var(--ink);
  font-size:var(--ui-size);
  font-weight:700;
}
.section{
  margin:12px 0 6px;
  color:var(--ink);
  font-size:var(--ui-size);
  font-weight:700;
}
.divider{height:1px;margin:14px 0;background:var(--line)}
.row{position:relative;margin:4px 0}
.flat{
  height:var(--control-h);
  padding-left:10px;
  border-radius:var(--radius-control);
  display:grid;
  grid-template-columns:142px 1fr 38px;
  align-items:center;
}
.flat:hover{background:var(--hover)}
.row[id]>.flat{cursor:pointer}

.label,.value,.option,.num,.stepper button{
  color:var(--gray);
  font-size:var(--ui-size);
  font-weight:400;
}
.value{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:8px;
  text-align:right;
}
.chip{
  width:22px;
  height:22px;
  border:1px solid rgba(0,0,0,.14);
  border-radius:6px;
}
.chev,.stepper{width:38px;height:38px;color:var(--gray)}
.chev{display:grid;place-items:center}
.stepper{display:grid;grid-template-rows:1fr 1fr}
.stepper button{
  padding:0;
  border:0;
  background:transparent;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.stepper button:hover{color:var(--ink)}
.num{
  width:70px;
  padding:0;
  border:0;
  outline:0;
  appearance:textfield;
  background:transparent;
  text-align:right;
}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.pop{
  position:absolute;
  right:0;
  top:44px;
  z-index:30;
  width:150px;
  max-height:50vh;
  display:none;
  overflow-y:auto;
  overflow-x:hidden;
  scrollbar-width:thin;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius-control);
  box-shadow:0 10px 28px rgba(0,0,0,.14);
}
.pop.show{display:block}
.pop.open-up{top:auto;bottom:44px}
.option{
  width:100%;
  height:38px;
  padding:0 10px;
  border:0;
  border-bottom:1px solid var(--line);
  background:var(--paper);
  display:flex;
  align-items:center;
  gap:8px;
  text-align:left;
  cursor:pointer;
}
.option:last-child{border-bottom:0}
.option:hover{background:var(--hover)}
.option.active{background:var(--active)}

/* Context menus */
.ctx{
  position:fixed;
  z-index:50;
  min-width:160px;
  padding:5px;
  display:none;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius-control);
  box-shadow:0 10px 30px rgba(0,0,0,.15);
}
.ctx button{
  width:100%;
  height:36px;
  padding:0 10px;
  border:0;
  border-radius:6px;
  background:transparent;
  text-align:left;
  color:var(--gray);
  font-size:var(--ui-size);
  font-weight:400;
  cursor:pointer;
}
.ctx button:hover{background:var(--hover)}
.ctx .danger{color:var(--danger)}

/* Modals */
.overlay{
  position:fixed;
  inset:0;
  z-index:60;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.22);
}
.overlay.show{display:flex}

/* Full-screen login / logout entry page */
body.auth-screen{
  background:var(--bg);
}

body.auth-screen .app{
  visibility:hidden;
  pointer-events:none;
}

.overlay.auth-overlay{
  z-index:100;
  background:var(--bg);
  backdrop-filter:none;
}

.modal{
  width:min(450px,calc(100vw - 32px));
  padding:20px;
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius-popup);
  box-shadow:0 18px 64px rgba(0,0,0,.25);
}
.modal h3{
  margin:0 0 12px;
  color:var(--ink);
  font-size:var(--ui-size);
  font-weight:700;
  line-height:1.4;
}
.modal-input{
  width:100%;
  height:48px;
  padding:0 11px;
  border:1px solid var(--line);
  border-radius:var(--radius-control);
  outline:none;
  background:var(--paper);
  color:var(--ink);
  font-size:var(--ui-size);
  font-weight:400;
  line-height:1.5;
}
.modal-input:focus{
  border-color:#b9b7b2;
  box-shadow:0 0 0 2px rgba(47,52,55,.08);
}
.modal-input::placeholder{color:var(--gray);opacity:1}
.modal-message{
  margin:0;
  color:var(--gray);
  font-size:var(--ui-size);
  font-weight:400;
  line-height:1.6;
}
.modal-actions{
  margin-top:12px;
  display:flex;
  justify-content:flex-end;
  gap:var(--button-gap);
}
.modal-actions button{
  height:var(--control-h);
  padding:0 12px;
  border:1px solid var(--line);
  border-radius:var(--radius-control);
  background:var(--paper);
  color:var(--gray);
  font-size:var(--ui-size);
  font-weight:400;
  cursor:pointer;
}
.modal-actions button:hover{background:var(--hover)}
.modal-actions .primary{
  border-color:var(--ink);
  background:var(--ink);
  color:#fff;
}
.modal-actions .primary:hover{background:#25292c}
.modal-actions .danger{
  margin-right:auto;
  color:var(--danger);
}
.modal-actions .danger-primary{
  border-color:var(--danger);
  background:var(--danger);
  color:#fff;
}
.modal-actions .danger-primary:hover{background:#9d1e15}


/* Dark mode */
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#171816;
  --sidebar:#1b1c1a;
  --paper:#20211f;
  --ink:#f1f1ef;
  --gray:#a9aaa5;
  --line:#343532;
  --hover:#2a2b28;
  --active:#30312e;
  --danger:#ff746c;
  --shadow-card:0 10px 30px rgba(0,0,0,.24);
  --shadow-popup:0 12px 38px rgba(0,0,0,.38);
}
html[data-theme="dark"] button:focus-visible{outline-color:rgba(241,241,239,.24)}
html[data-theme="dark"] .auth-overlay{background:rgba(23,24,22,.92)}
html[data-theme="dark"] .chip{border-color:rgba(255,255,255,.18)}
html[data-theme="dark"] .annotation-text{color:#2f3437}
html[data-theme="dark"] .annotation-note{color:color-mix(in srgb,var(--theme-bottom-text) 68%,white 32%)}
html[data-theme="dark"] .annotation.note-above .annotation-note{color:color-mix(in srgb,var(--theme-top-text) 68%,white 32%)}
html[data-theme="dark"] .annotation.selected .annotation-text{outline-color:rgba(255,255,255,.28)}
html[data-theme="dark"] .modal-input:focus{border-color:#777872;box-shadow:0 0 0 2px rgba(241,241,239,.08)}
html[data-theme="dark"] .modal-actions .primary{border-color:#f1f1ef;background:#f1f1ef;color:#20211f}
html[data-theme="dark"] .modal-actions .primary:hover{background:#deded9}

@media print{
  html[data-theme="dark"]{color-scheme:light;--paper:#fff;--ink:#2f3437}
  html[data-theme="dark"] .annotation-text{color:#2f3437}
}

/* Responsive */
@media (max-width:1100px){
  .main:not(.has-video) .toolbar,.main:not(.has-video) .paper{width:100%}
  .main.has-video .workspace{
    grid-template-columns:1fr;
    grid-template-rows:auto minmax(0,1fr);
  }
  .main.has-video .video-panel{max-height:42vh}
}

/* Print only the document */
@media print{
  @page{margin:16mm}
  html,body{width:auto;height:auto;overflow:visible;background:#fff}
  .sidebar,.toolbar,.video-panel,.settings,.ctx,.overlay{display:none!important}
  .app,.main,.workspace{
    display:block!important;
    width:auto!important;
    height:auto!important;
    margin:0!important;
    padding:0!important;
    overflow:visible!important;
  }
  .paper,.main:not(.has-video) .paper{
    display:block!important;
    width:100%!important;
    height:auto!important;
    min-height:0!important;
    margin:0!important;
    padding:0!important;
    border:0!important;
    border-radius:0!important;
    box-shadow:none!important;
    overflow:visible!important;
  }
  #editor{
    display:block!important;
    height:auto!important;
    min-height:0!important;
    overflow:visible!important;
  }
  .annotation.selected .annotation-text{outline:none!important}
}

</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="auth-screen">

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span>🌹 Rosedic</span>
      <button id="newPage" aria-label="새 페이지">
        <svg class="corner-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 5v14M5 12h14"></path>
        </svg>
      </button>
    </div>

    <div id="pages" class="pages"></div>

    <div class="side-actions">
      <button id="backup">전체 백업</button>
      <button id="logoutBtn">로그아웃</button>
    </div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <div class="toolbar-left">
        <button id="sidebarToggle" class="sidebar-toggle" type="button"

<script>
(function(){
  // ===== Supabase 설정 =====
  // Supabase Dashboard > Connect 에서 아래 2개 값을 복사해 넣으세요.
  const SUPABASE_URL='https://brcdaquvxjsnphkjfuql.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY='sb_publishable_OX1J_jftk1LeANo1EUkGZg_1ZsW0Z3s';

  const CLOUD_TABLE='rosedic_user_data';
  const CACHE_PREFIX='rosedic-cloud-cache-v1:';
const COLORS=[
    ['기본','#37352F','#FFFFFF'],
    ['회색','#9B9A97','#EBECED'],
    ['갈색','#64473A','#E9E5E3'],
    ['주황','#D9730D','#FAEBDD'],
    ['노랑','#DFAB01','#FBF3DB'],
    ['초록','#0F7B6C','#DDEDEA'],
    ['파랑','#0B6E99','#DDEBF1'],
    ['보라','#6940A5','#EAE4F2'],
    ['분홍','#AD1A72','#F4DFEB'],
    ['빨강','#E03E3E','#FBE4E4']
  ];
  const LINE=[
    [2.0,'촘촘하게'],[2.25,'약간 촘촘'],[2.5,'기본'],[2.75,'넓게'],[3.0,'아주 넓게'],[3.25,'매우 넓게']
  ];
  const WEIGHT=[[400,'보통'],[600,'중간'],[700,'굵게'],[800,'아주 굵게']];

  const $=id=>document.getElementById(id);
  const app=document.querySelector('.app'),pages=$('pages'),paper=$('paper'),title=$('title'),editor=$('editor'),settings=$('settings');
  const sidebarToggle=$('sidebarToggle'),themeToggle=$('themeToggle'),pdfBtn=$('pdfBtn');
  const ctx=$('ctx'),pageCtx=$('pageCtx'),overlay=$('overlay'),noteInput=$('noteInput');

  const linkBtn=$('linkBtn'),linkOverlay=$('linkOverlay'),linkInput=$('linkInput');
  const videoPanel=$('videoPanel'),youtubePlayer=$('youtubePlayer');
  const mainArea=document.querySelector('.main');
  const pageOverlay=$('pageOverlay'),pageNameInput=$('pageNameInput'),pageDialogMessage=$('pageDialogMessage');
  const pageDialogTitle=$('pageDialogTitle'),confirmPageDialog=$('confirmPageDialog');
  const bottomThemeChip=$('bottomThemeChip'),topThemeChip=$('topThemeChip');
  const bottomThemePop=$('bottomThemePop'),topThemePop=$('topThemePop'),linePop=$('linePop'),weightPop=$('weightPop');
  const bodySize=$('bodySize'),titleSize=$('titleSize'),lineValue=$('lineValue'),weightValue=$('weightValue');
  const authOverlay=$('authOverlay'),authUsername=$('authUsername'),authPassword=$('authPassword'),passwordToggle=$('passwordToggle'),authMessage=$('authMessage');
  const loginBtn=$('loginBtn'),signupBtn=$('signupBtn'),logoutBtn=$('logoutBtn');

  let state={active:null,pages:{}};
  let range=null,ann=null,saveTimer=null,pageCtxTarget=null,pageDialogMode=null,pageDialogTarget=null;

  let sb=null;
  let currentUser=null;
  let cloudSaveTimer=null;
  let cloudPollTimer=null;
  let cloudSaving=false;
  let localRevision=0;
  let lastCloudUpdatedAt='';
  let appReady=false;

  function id(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
  function fresh(name='새 페이지'){
    return{
      id:id(),
      title:name,
      html:'<p></p>',
      videoUrl:'',
      themeBottomText:'#AD1A72',
      themeBottomBg:'#F4DFEB',
      themeTopText:'#6940A5',
      themeTopBg:'#EAE4F2',
      body:16,
      line:2.5,
      titleSize:38,
      weight:700
    };
  }

  function normalizePage(p){
    p.title=p.title||'새 페이지';
    p.html=p.html||'<p></p>';
    p.videoUrl=typeof p.videoUrl==='string'?p.videoUrl:'';
    p.body=Number(p.body)||16;
    p.line=Number(p.line)||2.5;
    if(p.line===1.8)p.line=2.5;
    p.titleSize=Number(p.titleSize)||38;
    p.weight=Number(p.weight)||700;

    if(!p.themeBottomText){
      const c=COLORS.find(x=>x[1]===(p.themeBottom||p.theme));
      p.themeBottomText=c?c[1]:'#AD1A72';
    }
    if(!p.themeBottomBg){
      const c=COLORS.find(x=>x[1]===p.themeBottomText);
      p.themeBottomBg=c?c[2]:'#F4DFEB';
    }
    if(!p.themeTopText){
      const c=COLORS.find(x=>x[1]===(p.themeTop||p.theme));
      p.themeTopText=c?c[1]:'#6940A5';
    }
    if(!p.themeTopBg){
      const c=COLORS.find(x=>x[1]===p.themeTopText);
      p.themeTopBg=c?c[2]:'#EAE4F2';
    }
    return p;
  }

  function blankState(){
    const p=fresh();
    return{active:p.id,pages:{[p.id]:p}};
  }

  function normalizeState(raw){
    const next=(raw&&typeof raw==='object')?raw:{active:null,pages:{}};
    if(!next.pages||typeof next.pages!=='object')next.pages={};
    Object.values(next.pages).forEach(normalizePage);

    if(!next.active||!next.pages[next.active]){
      const ids=Object.keys(next.pages);
      if(ids.length)next.active=ids[ids.length-1];
      else{
        const p=fresh();
        next.pages[p.id]=p;
        next.active=p.id;
      }
    }
    return next;
  }

  function cacheKey(){
    return currentUser?CACHE_PREFIX+currentUser.id:null;
  }

  function saveLocalCache(){
    const key=cacheKey();
    if(key)localStorage.setItem(key,JSON.stringify(state));
  }

  function loadLocalCache(){
    const key=cacheKey();
    if(!key)return null;
    try{
      const raw=localStorage.getItem(key);
      return raw?normalizeState(JSON.parse(raw)):null;
    }catch(e){
      return null;
    }
  }

  const THEME_KEY='rosedic-theme-v1';

  function currentTheme(){
    return document.documentElement.dataset.theme==='dark'?'dark':'light';
  }

  function applyTheme(mode){
    const theme=mode==='dark'?'dark':'light';
    document.documentElement.dataset.theme=theme;
    localStorage.setItem(THEME_KEY,theme);
    themeToggle.setAttribute('aria-label','화면 모드 전환');
    themeToggle.title='화면 모드 전환';
  }

  function toggleTheme(){
    applyTheme(currentTheme()==='dark'?'light':'dark');
    requestAnimationFrame(layoutAnnotations);
  }

  const USERNAME_DOMAIN='rosedic.local';

  function normalizeUsername(value){
    return value.trim().toLowerCase();
  }

  function validUsername(value){
    return /^[a-z0-9][a-z0-9._-]{2,31}$/.test(value);
  }

  function usernameToEmail(username){
    return `${normalizeUsername(username)}@${USERNAME_DOMAIN}`;
  }

  function emailToUsername(email=''){
    const suffix='@'+USERNAME_DOMAIN;
    return email.endsWith(suffix)?email.slice(0,-suffix.length):email;
  }

  function setAuthMessage(message='',isError=false){
    authMessage.textContent=message;
    authMessage.classList.toggle('hidden',!message);
    authMessage.classList.toggle('error',!!isError);
  }

  function setAuthBusy(busy){
    loginBtn.disabled=busy;
    signupBtn.disabled=busy;
    authUsername.disabled=busy;
    authPassword.disabled=busy;
  }

  function clearAuthFields(){
    authUsername.value='';
    authPassword.value='';
    authPassword.type='password';
    passwordToggle.classList.remove('is-visible');
    passwordToggle.setAttribute('aria-label','비밀번호 보기');
    passwordToggle.title='비밀번호 보기';
  }

  function showAuth(){
    document.body.classList.add('auth-screen');
    authOverlay.classList.add('show');
    requestAnimationFrame(()=>authUsername.focus());
  }

  function hideAuth(){
    authOverlay.classList.remove('show');
    document.body.classList.remove('auth-screen');
  }

  function showWorkspace(){
    apply(current());
    renderPages();
    requestAnimationFrame(layoutAnnotations);
  }

  function current(){return state.pages[state.active]}

  function scheduleCloudSave(){
    if(!currentUser||!sb)return;
    clearTimeout(cloudSaveTimer);
    cloudSaveTimer=setTimeout(()=>pushCloudState(),650);
  }

  function persist(){
    if(!currentUser)return;
    saveLocalCache();
    localRevision++;
    scheduleCloudSave();
  }

  function schedule(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{
      saveCurrent();
      persist();
    },200);
  }

  function saveCurrent(){
    const p=current();
    if(!p)return;
    p.title=title.textContent.trim()||'제목 없음';
    p.html=editor.innerHTML;
    p.themeBottomText=getComputedStyle(paper).getPropertyValue('--theme-bottom-text').trim()||'#AD1A72';
    p.themeBottomBg=getComputedStyle(paper).getPropertyValue('--theme-bottom-bg').trim()||'#F4DFEB';
    p.themeTopText=getComputedStyle(paper).getPropertyValue('--theme-top-text').trim()||'#6940A5';
    p.themeTopBg=getComputedStyle(paper).getPropertyValue('--theme-top-bg').trim()||'#EAE4F2';
    p.body=Number(bodySize.value)||16;
    p.titleSize=Number(titleSize.value)||38;
  }

  async function pushCloudState(force=false){
    if(!currentUser||!sb)return;
    if(cloudSaving&&!force)return;

    clearTimeout(cloudSaveTimer);
    const revision=localRevision;
    const snapshot=JSON.parse(JSON.stringify(state));
    cloudSaving=true;

    const {data,error}=await sb
      .from(CLOUD_TABLE)
      .upsert({user_id:currentUser.id,data:snapshot},{onConflict:'user_id'})
      .select('updated_at')
      .single();

    cloudSaving=false;

    if(error){
      console.error('Rosedic cloud save failed:',error);
      scheduleCloudSave();
      return;
    }

    if(data?.updated_at)lastCloudUpdatedAt=data.updated_at;

    if(revision!==localRevision){
      scheduleCloudSave();
    }
  }

  async function pullCloudState(){
    if(!currentUser||!sb||cloudSaving)return;
    if(cloudSaveTimer)return;

    const {data,error}=await sb
      .from(CLOUD_TABLE)
      .select('data,updated_at')
      .eq('user_id',currentUser.id)
      .maybeSingle();

    if(error){
      console.error('Rosedic cloud refresh failed:',error);
      return;
    }
    if(!data)return;

    const remoteTime=Date.parse(data.updated_at||'')||0;
    const localTime=Date.parse(lastCloudUpdatedAt||'')||0;

    if(remoteTime>localTime){
      state=normalizeState(data.data);
      lastCloudUpdatedAt=data.updated_at||'';
      saveLocalCache();
      showWorkspace();
    }
  }

  function stopCloudPolling(){
    if(cloudPollTimer)clearInterval(cloudPollTimer);
    cloudPollTimer=null;
  }

  function startCloudPolling(){
    stopCloudPolling();
    cloudPollTimer=setInterval(()=>pullCloudState(),5000);
  }

  async function loadUserWorkspace(user){
    currentUser=user;
    const displayName=emailToUsername(user.email||'');
    logoutBtn.textContent=`로그아웃 (${displayName})`;
    logoutBtn.title=`로그아웃 (${displayName})`;

    const cached=loadLocalCache();

    const {data,error}=await sb
      .from(CLOUD_TABLE)
      .select('data,updated_at')
      .eq('user_id',user.id)
      .maybeSingle();

    if(error){
      if(cached){
        state=cached;
        showWorkspace();
        hideAuth();
        appReady=true;
        startCloudPolling();
        return;
      }
      throw error;
    }

    if(data){
      state=normalizeState(data.data);
      lastCloudUpdatedAt=data.updated_at||'';
      saveLocalCache();
    }else{
      state=cached||blankState();
      saveLocalCache();
      localRevision++;
      await pushCloudState(true);
    }

    showWorkspace();
    hideAuth();
    appReady=true;
    startCloudPolling();
  }

  async function handleSession(session){
    const user=session?.user||null;

    if(!user){
      stopCloudPolling();
      currentUser=null;
      appReady=false;
      logoutBtn.textContent='로그아웃';
      logoutBtn.title='로그아웃';
      state={active:null,pages:{}};
      clearAuthFields();
      setAuthMessage('');
      showAuth();
      return;
    }

    if(currentUser?.id===user.id&&appReady)return;

    setAuthBusy(true);
    setAuthMessage('필기를 불러오는 중입니다.');
    try{
      await loadUserWorkspace(user);
      setAuthMessage('');
    }catch(error){
      console.error(error);
      setAuthMessage('클라우드 데이터를 불러오지 못했습니다. Supabase 설정을 확인해주세요.',true);
      showAuth();
    }finally{
      setAuthBusy(false);
    }
  }

  function supabaseIsConfigured(){
    return !SUPABASE_URL.startsWith('YOUR_') &&
           !SUPABASE_PUBLISHABLE_KEY.startsWith('YOUR_');
  }

  async function bootCloud(){
    if(!supabaseIsConfigured()){
      setAuthMessage('Supabase 연결 설정이 필요합니다. HTML 상단의 SUPABASE_URL과 SUPABASE_PUBLISHABLE_KEY를 입력해주세요.',true);
      showAuth();
      setAuthBusy(true);
      return;
    }

    if(!window.supabase?.createClient){
      setAuthMessage('Supabase 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인해주세요.',true);
      showAuth();
      setAuthBusy(true);
      return;
    }

    sb=window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY,
      {
        auth:{
          persistSession:true,
          autoRefreshToken:true,
          detectSessionInUrl:true
        }
      }
    );

    sb.auth.onAuthStateChange((event,session)=>{
      setTimeout(()=>handleSession(session),0);
    });

    const {data,error}=await sb.auth.getSession();
    if(error){
      setAuthMessage(error.message,true);
      showAuth();
      return;
    }
    await handleSession(data.session);
  }


  function renderPages(){
    pages.innerHTML='';
    Object.values(state.pages).reverse().forEach(p=>{
      const d=document.createElement('div');

  function parseTimeToSeconds(value){
    if(!value)return 0;
    if(/^\d+$/.test(value)) return Number(value);
    const h=(value.match(/(\d+)h/)||[])[1]||0;
    const m=(value.match(/(\d+)m/)||[])[1]||0;
    const s=(value.match(/(\d+)s/)||[])[1]||0;
    return Number(h)*3600+Number(m)*60+Number(s);
  }

  function parseYouTubeUrl(raw){
    if(!raw)return null;
    let url;
    try{
      url=new URL(raw.trim());
    }catch(e){
      try{url=new URL('https://'+raw.trim())}catch(_){return null}
    }

    const host=url.hostname.replace(/^www\./,'').replace(/^m\./,'');
    let id='';

    if(host==='youtu.be'){
      id=url.pathname.split('/').filter(Boolean)[0]||'';
    }else if(host==='youtube.com' || host==='music.youtube.com'){
      if(url.pathname==='/watch'){
        id=url.searchParams.get('v')||'';
      }else{
        const parts=url.pathname.split('/').filter(Boolean);
        if(['embed','shorts','live'].includes(parts[0])) id=parts[1]||'';
      }
    }else{
      return null;
    }

    id=id.replace(/[^A-Za-z0-9_-]/g,'');
    if(!id)return null;

    const timeValue=url.searchParams.get('t') || url.searchParams.get('start') || '';
    const start=parseTimeToSeconds(timeValue);

    return {id,start};
  }

  function renderVideo(){
    const p=current();

      mainArea.classList.remove('has-video');
      requestAnimationFrame(()=>layoutAnnotations());

    }

    let src='https://www.youtube.com/embed/'+encodeURIComponent(parsed.id)+'?rel=0';
    if(parsed.start>0) src+='&start='+parsed.start;

    if(youtubePlayer.dataset.videoSrc!==src){
      youtubePlayer.src=src;
      youtubePlayer.dataset.videoSrc=src;
    }
    videoPanel.classList.add('show');
    mainArea.classList.add('has-video');

  function intervalsOverlap(a,b,pad=8){
    return !(a.right + pad <= b.left || b.right + pad <= a.left);

  function layoutAnnotations(){
    const annotations=[...editor.querySelectorAll('.annotation')];
    if(!annotations.length)return;

    /* 항상 아래를 기본값으로 시작 + 이전 가로 보정 초기화 */
    annotations.forEach(a=>{
      a.classList.remove('note-above');
      a.style.setProperty('--note-shift','0px');
    });

    /*
      실제 설명 박스끼리 충돌한 뒤 판단하는 대신,
      각 설명의 '예상 가로 영역'을 먼저 계산한다.
      따라서 서로 붙어 있는 단어에서도 안정적으로 위/아래가 갈린다.
    */
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        const rows=[];

        annotations.forEach(a=>{
          const text=a.querySelector('.annotation-text');
          const note=a.querySelector('.annotation-note');
          if(!text||!note)return;

          const tr=text.getBoundingClientRect();

          /* 같은 줄 판정: 글자의 세로 중심이 비슷하면 같은 row */
          const centerY=tr.top + tr.height/2;
          let row=rows.find(r=>Math.abs(r.centerY-centerY) <= Math.max(6,tr.height*.55));

          if(!row){
            row={centerY,below:[],above:[]};
            rows.push(row);
          }

          /*
            scrollWidth는 실제 설명 문자열이 필요로 하는 폭.
            화면에서는 max-width 420px이므로 동일하게 제한.
          */
          const noteWidth=Math.min(
            420,
            Math.max(note.scrollWidth || 0, note.getBoundingClientRect().width || 0, 12)
          );
          const centerX=tr.left + tr.width/2;
          const projected={
            left:centerX-noteWidth/2,
            right:centerX+noteWidth/2
          };

          const hitBelow=row.below.some(x=>intervalsOverlap(projected,x,8));

          if(hitBelow){
            /*
              아래 lane과 겹치면 무조건 위 lane으로 이동.
              사용자가 설명을 많이 달지 않는 전제에서는 이 2-lane 방식이 가장 단순하고 안정적.
            */
            a.classList.add('note-above');
            row.above.push(projected);
          }else{
            row.below.push(projected);
          }
        });

        /*
          설명이 좌우 본문 여백 밖으로 나가면 안쪽으로 자동 이동.
          글씨 크기가 바뀌거나 줄바꿈 위치가 달라져도 매번 다시 계산한다.
        */
        const editorRect=editor.getBoundingClientRect();
        const inset=4;

        annotations.forEach(a=>{
          const note=a.querySelector('.annotation-note');
          if(!note)return;

          a.style.setProperty('--note-shift','0px');
          const r=note.getBoundingClientRect();
          let shift=0;

          if(r.left < editorRect.left + inset){
            shift += (editorRect.left + inset) - r.left;
          }
          if(r.right > editorRect.right - inset){
            shift -= r.right - (editorRect.right - inset);
          }

          a.style.setProperty('--note-shift',shift+'px');
        });
      });
    });
  }

  function pastePlainText(e,target,isTitle){
    e.preventDefault();
    const text=(e.clipboardData||window.clipboardData).getData('text/plain');
    const clean=isTitle ? text.replace(/[\r\n]+/g,' ') : text;
    target.focus();
    /* 브라우저의 native undo stack을 최대한 사용 */
    if(document.queryCommandSupported && document.queryCommandSupported('insertText')){
      document.execCommand('insertText',false,clean);
    }else{
      const sel=window.getSelection();
      if(!sel||!sel.rangeCount)return;
      const r=sel.getRangeAt(0);
      r.deleteContents();
      r.insertNode(document.createTextNode(clean));
      r.collapse(false);
      sel.removeAllRanges();
      sel.addRange(r);
    }
  }

    if(!sb)return;
    const username=normalizeUsername(authUsername.value);
    const password=authPassword.value;

    if(!username||!password){
      setAuthMessage('아이디와 비밀번호를 입력해주세요.',true);
      return;
    }
    if(!validUsername(username)){
      setAuthMessage('아이디는 영문 소문자, 숫자, 점(.), 밑줄(_), 하이픈(-)만 사용할 수 있고 3~32자여야 합니다.',true);
      return;
    }

    setAuthBusy(true);
    setAuthMessage('로그인 중입니다.');

    const {error}=await sb.auth.signInWithPassword({
      email:usernameToEmail(username),
      password
    });

    if(error){
      setAuthMessage('아이디 또는 비밀번호를 확인해주세요.',true);
      setAuthBusy(false);
    }
  }

  async function doSignup(){
    if(!sb)return;
    const username=normalizeUsername(authUsername.value);
    const password=authPassword.value;

    if(!username||!password){
      setAuthMessage('아이디와 비밀번호를 입력해주세요.',true);
      return;
    }
    if(!validUsername(username)){
      setAuthMessage('아이디는 영문 소문자, 숫자, 점(.), 밑줄(_), 하이픈(-)만 사용할 수 있고 3~32자여야 합니다.',true);
      return;
    }
    if(password.length<6){
      setAuthMessage('비밀번호는 6자 이상으로 입력해주세요.',true);
      return;
    }

    setAuthBusy(true);
    setAuthMessage('회원가입 중입니다.');

    const {data,error}=await sb.auth.signUp({
      email:usernameToEmail(username),
      password
    });

    if(error){
      const msg=(error.message||'').toLowerCase();
      if(msg.includes('already')||msg.includes('registered')){
        setAuthMessage('이미 사용 중인 아이디입니다.',true);
      }else{
        setAuthMessage(error.message||'회원가입에 실패했습니다.',true);
      }
      setAuthBusy(false);
      return;
    }

    if(data.session){
      setAuthMessage('가입되었습니다. 로그인 중입니다.');
    }else{
      setAuthMessage('가입은 되었지만 이메일 확인 설정이 켜져 있습니다. Supabase에서 Confirm email을 꺼주세요.',true);
      setAuthBusy(false);
    }
  }

  loginBtn.onclick=doLogin;
  signupBtn.onclick=doSignup;

  authUsername.onkeydown=e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      authPassword.focus();
    }
  };

  passwordToggle.onclick=()=>{
    const visible=authPassword.type==='text';
    authPassword.type=visible?'password':'text';
    passwordToggle.classList.toggle('is-visible',!visible);
    const label=visible?'비밀번호 보기':'비밀번호 숨기기';
    passwordToggle.setAttribute('aria-label',label);
    passwordToggle.title=label;
    authPassword.focus();
  };

  authPassword.onkeydown=e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      doLogin();
    }
  };

  logoutBtn.onclick=async()=>{
    if(!sb)return;
    saveCurrent();
    persist();
    await pushCloudState(true);
    clearAuthFields();
    await sb.auth.signOut();
  };

  sidebarToggle.onclick=()=>{
    const collapsed=app.classList.toggle('sidebar-collapsed');
    const label=collapsed?'페이지 목록 펼치기':'페이지 목록 접기';
    sidebarToggle.setAttribute('aria-expanded',String(!collapsed));
    sidebarToggle.setAttribute('aria-label',label);
    sidebarToggle.title=label;
    requestAnimationFrame(layoutAnnotations);
  };

  themeToggle.addEventListener('click',e=>{
    e.preventDefault();
    toggleTheme();
  });

  $('newPage').onclick=openCreatePageDialog;
  $('backup').onclick=()=>{saveCurrent();persist();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='rosedic_backup.json';a.click()};

  pdfBtn.onclick=e=>{
    e.preventDefault();
    saveCurrent();
    persist();
    window.print();
  };

  applyTheme(localStorage.getItem(THEME_KEY)==='dark'?'dark':'light');

  bootCloud();

  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(()=>{
      if(appReady)layoutAnnotations();
    });
  }

  window.addEventListener('focus',()=>{
    if(appReady)pullCloudState();
  });

  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible'&&appReady)pullCloudState();
  });
})();
</script>
</body>
</html>
