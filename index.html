<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rosedic v51</title>
<style>
:root{
  --bg:#f7f7f5;--paper:#fff;--ink:#2f3437;--gray:#6b7280;--line:#e7e7e4;--hover:#f1f1ef;
  --h:38px;--icon:15px;--stroke:2.3;
  --text-app:16px;
  --text-ui:16px;
  --weight-strong:700;
  --weight-medium:400;
  --weight-regular:400;
--ui-size:16px;--ui-primary:#2f3437;--ui-secondary:#787774;--ui-primary-weight:700;--ui-secondary-weight:400;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.sidebar{background:#fbfbfa;border-right:1px solid var(--line);padding:14px 10px}
.brand{
  height:38px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 8px;
  font-size:var(--text-ui);
  font-weight:var(--weight-medium);
  color:var(--ink);
}
.brand button{
  width:28px;
  height:28px;
  border:0;
  background:transparent;
  border-radius:8px;
  display:grid;
  place-items:center;
  cursor:pointer;
  padding:0;
  color:var(--ink);
}
.brand button:hover{background:var(--hover)}
.brand .corner-icon{display:block}

.pages{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.page{
  height:62px;
  box-sizing:border-box;
  padding:8px;
  border-radius:7px;
  cursor:pointer;
  font-size:16px;
  font-weight:400;
  color:var(--ui-secondary);
  overflow:hidden;
}

.page-title-label{
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  line-clamp:2;
  overflow:hidden;
  text-overflow:ellipsis;
  line-height:1.4;
  max-height:2.8em;
  word-break:break-word;
  overflow-wrap:anywhere;
}

.page:hover{background:var(--hover)}
.page.active{background:#ececea;font-weight:400}
.side-actions{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
.side-actions button{
  display:block;
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  padding:8px;
  border-radius:7px;
  color:var(--gray);
  cursor:pointer;
  font-size:var(--text-ui);
  font-weight:var(--weight-regular);
}
.side-actions button:hover{background:var(--hover);color:var(--ink)}

.main{padding:22px 24px 60px;min-width:0}
.toolbar{max-width:980px;margin:0 auto 16px;display:flex;justify-content:flex-end;align-items:center;gap:8px;position:relative}
.toolbar>button{
  height:var(--h);
  border:1px solid var(--line);
  background:#fff;
  border-radius:8px;
  padding:0 12px;
  display:flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
  font-size:var(--text-ui);
  font-weight:var(--weight-regular);
  color:var(--ink);
}
.toolbar>button:hover{background:var(--hover)}
.toolbar svg,.icon svg{width:var(--icon);height:var(--icon);fill:none;stroke:currentColor;stroke-width:var(--stroke);stroke-linecap:round;stroke-linejoin:round}
.status{
  font-size:var(--text-ui);
  font-weight:var(--weight-regular);
  color:var(--gray);
}

.paper{
  --body-size:16px;--line-height:2.5;--title-size:38px;--title-weight:700;--theme-bottom-text:#AD1A72;--theme-bottom-bg:#F4DFEB;--theme-top-text:#6940A5;--theme-top-bg:#EAE4F2;
max-width:980px;min-height:80vh;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:14px;
  padding:68px 72px 72px 72px;box-shadow:0 10px 30px rgba(0,0,0,.035)
}
#title{font-size:var(--title-size);font-weight:var(--title-weight);line-height:1.18;outline:none;margin:0 0 24px;white-space:pre-wrap;word-break:break-word}
#title:empty:before{content:"제목 없음";color:#c7c7c4}
#editor{
  font-size:var(--body-size);
  word-spacing:0;

  font-weight:400;
  line-height:var(--line-height);
  outline:none;
  min-height:60vh;
  text-align:justify;
  line-break:auto;
  text-justify:inter-word;
  font-synthesis:none;
  padding-top:20px;
}
#editor:empty:before{content:"여기에 자유롭게 필기하세요.";color:#b5b5b0}
#editor p,#editor div{margin:0}
.annotation{
  display:inline-block;
  position:relative;
  vertical-align:baseline;
  padding:0;
  margin:0;
  line-height:1;
}
.annotation-text{
  display:inline;
  padding:0 1px;
  border-radius:3px;
  background:var(--theme-bottom-bg);
  cursor:pointer;
  line-height:1;
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact
}
.annotation-note{
  position:absolute;
  left:50%;
  top:calc(100% + 3px);
  transform:translateX(-50%) translateX(var(--note-shift,0px));
  font:inherit!important;
  font-weight:400!important;
  font-style:normal!important;
  font-synthesis:none!important;
  letter-spacing:normal!important;
  line-height:1.15!important;
  color:var(--theme-bottom-text);
  white-space:nowrap;
  max-width:420px;
  overflow:hidden;
  text-overflow:ellipsis;
  cursor:pointer;
  z-index:4
}
/*
  설명은 본문 행 높이에 영향을 주지 않는다.
  기본은 단어 바로 아래, 충돌 시 단어 바로 위로 이동한다.
*/
.annotation.note-above .annotation-note{
  top:auto;
  bottom:calc(100% + 3px);
}
.annotation.note-above .annotation-note{color:var(--theme-top-text);}
.annotation.note-above .annotation-text{
  background:var(--theme-top-bg);
}
.annotation.selected .annotation-text{outline:2px solid rgba(47,52,55,.2);outline-offset:2px}

.settings{position:absolute;right:0;top:46px;width:330px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 38px rgba(0,0,0,.16);padding:14px;display:none;z-index:20}
.settings.show{display:block}
.settings-head{
  height:40px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:var(--text-ui);
  font-weight:var(--weight-medium);
  color:var(--ink);
}
.close{
  width:28px;
  height:28px;
  border:0;
  background:transparent;
  border-radius:8px;
  display:grid;
  place-items:center;
  cursor:pointer;
  padding:0;
  color:var(--ink);
}
.close:hover{background:var(--hover)}
.corner-icon{
  width:16px;
  height:16px;
  fill:none;
  stroke:currentColor;
  stroke-width:2.15;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.close .corner-icon{
  transform:rotate(45deg);
  transform-origin:50% 50%;
}
.section{
  font-size:var(--text-ui);
  font-weight:var(--weight-medium);
  color:var(--ink);
  margin:12px 0 6px;
}
.divider{height:1px;background:var(--line);margin:14px 0}

.row{position:relative;margin:4px 0}
.flat{height:var(--h);display:grid;grid-template-columns:118px 1fr 38px;align-items:center;border-radius:8px;padding-left:10px}
.flat:hover{background:var(--hover)}
.label{
  font-size:var(--text-ui);
  font-weight:var(--weight-regular);
  color:var(--gray);
}
.value{
  font-size:var(--text-ui);
  font-weight:var(--weight-regular);
  color:var(--ink);
  text-align:right;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:8px;
}
.chev,.stepper{width:38px;height:38px;color:var(--gray)}
.chev{display:flex;align-items:center;justify-content:center}
.chev svg,.stepper svg{width:var(--icon);height:var(--icon);fill:none;stroke:currentColor;stroke-width:var(--stroke);stroke-linecap:round;stroke-linejoin:round}
.stepper{display:grid;grid-template-rows:1fr 1fr}
.stepper button{border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--gray);cursor:pointer}
.stepper button:hover{background:var(--hover)}
.num{width:70px;border:0;background:transparent;outline:0;text-align:right;padding:0}
.num::-webkit-inner-spin-button,.num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.num{-moz-appearance:textfield}
.chip{width:22px;height:22px;border-radius:6px;border:1px solid rgba(0,0,0,.14)}

.pop{position:absolute;right:0;top:44px;width:150px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.14);overflow:hidden;display:none;z-index:30}
.pop.show{display:block}
.option{
  height:38px;
  border:0;
  border-bottom:1px solid var(--line);
  background:#fff;
  width:100%;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 10px;
  text-align:left;
  cursor:pointer;
  font-size:var(--text-ui);
  font-weight:var(--weight-regular);
  color:var(--gray);
}
.option:last-child{border-bottom:0}
.option:hover{background:var(--hover)}
.option.active{background:#f3f3f1}

.ctx{position:fixed;display:none;min-width:160px;background:#fff;border:1px solid var(--line);border-radius:9px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:5px;z-index:50}
.ctx button{
  height:36px;
  width:100%;
  border:0;
  background:transparent;
  text-align:left;
  border-radius:6px;
  padding:0 10px;
  cursor:pointer;
  font-size:var(--text-ui);
  font-weight:var(--weight-regular);
  color:var(--ink);
}
.ctx button:hover{background:var(--hover)}
.ctx .danger{color:#b42318}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.22);display:none;align-items:center;justify-content:center;z-index:60}
.overlay.show{display:flex}
.modal{width:min(450px,calc(100vw - 32px));background:#fff;border-radius:13px;padding:20px;box-shadow:0 18px 64px rgba(0,0,0,.25)}
.modal h3{margin:0 0 12px;font-size:var(--text-app);font-weight:var(--weight-strong);color:var(--ink)}
.modal textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:9px;padding:11px;resize:vertical;outline:none;font-size:16px;line-height:1.5}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.modal-actions button{
  border:1px solid var(--line);
  background:#fff;
  border-radius:8px;
  padding:8px 12px;
  cursor:pointer;
  font-size:var(--text-ui);
  font-weight:var(--weight-regular);
}
.modal-actions .primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.modal-actions .danger{color:#b42318;margin-right:auto}

@page{size:A4;margin:14mm 15mm}
@media print{
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sidebar,.toolbar,.video-panel,.settings,.ctx,.overlay{display:none!important}
  .app{display:block}.main{padding:0}.paper{border:0;box-shadow:none;border-radius:0;max-width:none;min-height:0;padding:0}
  .annotation.selected .annotation-text{outline:none}
}

/* ===== Rosedic UI typography system: only two hierarchy levels ===== */

/* All app chrome uses one size */
.sidebar,
.toolbar,
.settings,
.context-menu,
.modal,
.pop,
button,
input,
textarea,
select {
  font-size:var(--ui-size) !important;
  font-family:inherit;
}

/* LEVEL 1: bold + black */
.brand > span,
.settings-head > span,
.section,
.modal-title,
.context-menu .menu-title,
.ui-primary {
  font-size:var(--ui-size) !important;
  font-weight:var(--ui-primary-weight) !important;
  color:var(--ui-primary) !important;
}

/* LEVEL 2: regular + gray */
.page-item,
.page-item button,
.toolbar button,
.settings .label,
.settings .value,
.settings .option,
.context-menu button,
.modal label,
.modal input,
.modal textarea,
.modal button,
.rename,
.delete,
.ui-secondary {
  font-size:var(--ui-size) !important;
  font-weight:var(--ui-secondary-weight) !important;
  color:var(--ui-secondary) !important;
}

/* Header action icons are icon-only, but inherit unified visual tone */
.brand button,
.close,
.toolbar button svg,
.brand .corner-icon,
.close .corner-icon {
  color:var(--ui-secondary) !important;
}

/* Keep selected/current page readable without introducing a third level */
.page-item.active,
.page-item.active button {
  color:var(--ui-primary) !important;
  font-weight:var(--ui-secondary-weight) !important;
}

/* Dropdown/options: no extra bold state; selected state uses background only */
.pop .option,
.pop .option.active,
.pop button,
.pop button.active {
  font-size:var(--ui-size) !important;
  font-weight:var(--ui-secondary-weight) !important;
  color:var(--ui-secondary) !important;
}

/* Settings controls and stepper text stay in secondary hierarchy */
.settings input,
.settings button,
.settings .flat,
.settings .stepper,
.settings .stepper input {
  font-size:var(--ui-size) !important;
  font-weight:var(--ui-secondary-weight) !important;
  color:var(--ui-secondary) !important;
}

/* Main toolbar buttons are secondary UI text */
.toolbar button {
  font-size:var(--ui-size) !important;
  font-weight:var(--ui-secondary-weight) !important;
  color:var(--ui-secondary) !important;
}

/* Context menu and note modal follow the same two-level rule */
.context-menu button,
.modal .actions button,
.modal textarea,
.modal input {
  font-size:var(--ui-size) !important;
  font-weight:var(--ui-secondary-weight) !important;
  color:var(--ui-secondary) !important;
}

/* Input placeholder also stays secondary gray */
.modal textarea::placeholder,
.modal input::placeholder {
  color:var(--ui-secondary) !important;
  opacity:1;
}

/* Body/title editor content is NOT part of the UI hierarchy */
#editor {
  font-size:var(--body-size) !important;
  color:var(--ink) !important;
}
#pageTitle {
  font-size:var(--title-size) !important;
  font-weight:var(--title-weight) !important;
  color:var(--ink) !important;
}

/* Annotation display follows document body formatting, not UI chrome */
.annotation-note {
  font-size:inherit !important;
  font-weight:400 !important;
}


/* Exception: primary save action in explanation modal */
#saveNote{
  color:#ffffff !important;
}


/* Link dialog uses the same modal system as explanation dialog */
.modal-input{
  width:100%;
  box-sizing:border-box;
  height:48px;
  border:1px solid var(--line);
  border-radius:9px;
  padding:11px;
  outline:none;
  background:#fff;
  font-size:16px !important;
  line-height:1.5;
  font-weight:400 !important;
  color:var(--ui-primary) !important;
}
.modal-input::placeholder{
  color:var(--ui-secondary) !important;
  opacity:1;
}
#saveLink{
  color:#fff !important;
}


.video-panel{display:none;}
.video-panel.show{display:block}
.video-frame{
  position:relative;
  width:100%;
  aspect-ratio:16 / 9;
  overflow:hidden;
  border:1px solid var(--line);
  border-radius:14px;
  background:#000;
  box-shadow:0 10px 30px rgba(0,0,0,.035);
}
.video-frame iframe{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  border:0;
  display:block;
}


.workspace{
  width:100%;
  max-width:1680px;
  margin:0 auto;
  padding:0 24px 24px;
  box-sizing:border-box;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:20px;
  align-items:start;
}
.workspace .video-panel,
.workspace .paper{
  width:100%;
  max-width:none;
  margin:0;
  box-sizing:border-box;
}
.workspace .video-panel{
  position:sticky;
  top:76px;
}
.workspace .video-frame{
  width:100%;
  aspect-ratio:16 / 9;
}
.workspace .paper{
  min-height:calc(100vh - 104px);
}
@media (max-width:1100px){
  .workspace{
    grid-template-columns:1fr;
  }
  .workspace .video-panel{
    position:static;
  }
}


@media print{
  .workspace{
    display:block !important;
    max-width:none !important;

  }

  }

/* ===== Dictation workspace layout ===== */
.workspace{
  height:calc(100vh - 72px);
  min-height:620px;
  max-width:1680px;
  margin:0 auto;
  padding:18px 24px 24px;
  box-sizing:border-box;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:20px;
  align-items:stretch;
  overflow:hidden;
}

.workspace .video-panel{
  width:100%;
  max-width:none;
  margin:0;
  align-self:center;
  position:static;
  transform:none;
}

.workspace .video-frame{
  width:100%;
  aspect-ratio:16 / 9;
}

.youtube-open-link{
  display:block;
  margin-top:8px;
  text-align:right;
  font-size:16px;
  font-weight:400;
  color:var(--ui-secondary);
  text-decoration:none;
}
.youtube-open-link:hover{
  text-decoration:underline;
}

/* Fixed typing card: title stays visible, editor scrolls */
.workspace .paper{
  width:100%;
  max-width:none;
  margin:0;
  height:100%;
  min-height:0;
  box-sizing:border-box;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

#pageTitle{
  flex:0 0 auto;
}

#editor{
  flex:1 1 auto;
  min-height:0 !important;
  overflow-y:auto;
  overflow-x:hidden;
  padding-right:8px;
  scrollbar-gutter:stable;
}

/* Subtle scrollbar */
#editor::-webkit-scrollbar{
  width:10px;
}
#editor::-webkit-scrollbar-track{
  background:transparent;
}
#editor::-webkit-scrollbar-thumb{
  background:rgba(55,53,47,.18);
  border-radius:999px;
  border:3px solid transparent;
  background-clip:content-box;
}
#editor::-webkit-scrollbar-thumb:hover{
  background:rgba(55,53,47,.28);
  border:3px solid transparent;
  background-clip:content-box;
}

@media (max-width:1100px){
  .workspace{
    height:auto;
    min-height:0;
    grid-template-columns:1fr;
    overflow:visible;
  }
  .workspace .video-panel{
    align-self:auto;
  }
  .workspace .paper{
    height:70vh;
    min-height:560px;
  }
}



/* ===== Toolbar: right aligned and visible ===== */
.toolbar{
  display:flex !important;
  align-items:center !important;
  justify-content:flex-end !important;
  padding-left:24px !important;
  padding-right:24px !important;
  box-sizing:border-box;
}

.toolbar > .spacer{
  flex:1 1 auto !important;
  display:block !important;
}

#linkBtn,
#settingsBtn,
#pdfBtn{
  display:inline-flex !important;
  align-items:center !important;
  flex:0 0 auto !important;
  visibility:visible !important;
  opacity:1 !important;
}

/* Keep toolbar's right edge aligned with the workspace's right gutter */
.main{
  min-width:0;
}


/* ===== Dynamic workspace: single-page mode vs YouTube dictation mode ===== */

/* DEFAULT: no YouTube video -> v43-style single page */
.workspace{
  width:100% !important;
  max-width:980px !important;
  height:auto !important;
  min-height:0 !important;
  margin:0 auto !important;
  padding:0 !important;
  display:block !important;
  overflow:visible !important;
}

.workspace .paper{
  width:100% !important;
  max-width:980px !important;
  height:auto !important;
  min-height:80vh !important;
  margin:0 auto !important;
  display:block !important;
  overflow:visible !important;
}

.workspace #editor{
  min-height:60vh !important;
  overflow:visible !important;
  padding-right:0 !important;
  scrollbar-gutter:auto !important;
}

/* Default toolbar matches the single paper exactly */
.toolbar{
  width:100% !important;
  max-width:980px !important;
  margin:0 auto 16px !important;
  padding-left:0 !important;
  padding-right:0 !important;
  justify-content:flex-end !important;
}

/* VIDEO MODE: only active while a valid YouTube link exists */
.workspace.has-video{
  max-width:1680px !important;
  height:calc(100vh - 72px) !important;
  min-height:620px !important;
  padding:0 24px 24px !important;
  display:grid !important;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr) !important;
  gap:20px !important;
  align-items:stretch !important;
  overflow:hidden !important;
}

.workspace.has-video .video-panel{
  width:100% !important;
  max-width:none !important;
  margin:0 !important;
  align-self:center !important;
  position:static !important;
}

.workspace.has-video .paper{
  width:100% !important;
  max-width:none !important;
  height:100% !important;
  min-height:0 !important;
  margin:0 !important;
  display:flex !important;
  flex-direction:column !important;
  overflow:hidden !important;
}

.workspace.has-video #title{
  flex:0 0 auto !important;
}

.workspace.has-video #editor{
  flex:1 1 auto !important;
  min-height:0 !important;
  overflow-y:auto !important;
  overflow-x:hidden !important;
  padding-right:8px !important;
  scrollbar-gutter:stable !important;
}

/* In video mode toolbar spans same outer width as workspace,
   with the same 24px inset as the right typing panel. */
.main.has-video .toolbar{
  max-width:1680px !important;
  padding-left:24px !important;
  padding-right:24px !important;

<script>
(function(){
  const KEY='simple-note-clean-v51';
const COLORS=[
    ['기본','#37352F','#FFFFFF'],
    ['회색','#9B9A97','#EBECED'],
    ['갈색','#64473A','#E9E5E3'],
    ['주황','#D9730D','#FAEBDD'],
    ['노랑','#DFAB01','#FBF3DB'],
    ['초록','#0F7B6C','#DDEDEA'],
    ['파랑','#0B6E99','#DDEBF1'],
    ['보라','#6940A5','#EAE4F2'],
    ['분홍','#AD1A72','#F4DFEB'],
    ['빨강','#E03E3E','#FBE4E4']
  ];
  const LINE=[
    [2.0,'촘촘하게'],[2.25,'약간 촘촘'],[2.5,'기본'],[2.75,'넓게'],[3.0,'아주 넓게'],[3.25,'매우 넓게']
  ];
  const WEIGHT=[[400,'보통'],[600,'중간'],[700,'굵게'],[800,'아주 굵게']];

  const $=id=>document.getElementById(id);
  const pages=$('pages'),paper=$('paper'),title=$('title'),editor=$('editor'),settings=$('settings');
  const ctx=$('ctx'),overlay=$('overlay'),noteInput=$('noteInput');

  const linkBtn=$('linkBtn'),linkOverlay=$('linkOverlay'),linkInput=$('linkInput');
  const videoPanel=$('videoPanel'),youtubePlayer=$('youtubePlayer'),youtubeOpenLink=$('youtubeOpenLink');
  const workspace=$('workspace'),mainArea=document.querySelector('.main');
  const bottomThemeChip=$('bottomThemeChip'),topThemeChip=$('topThemeChip');
  const bottomThemePop=$('bottomThemePop'),topThemePop=$('topThemePop'),linePop=$('linePop'),weightPop=$('weightPop');
  const bodySize=$('bodySize'),titleSize=$('titleSize'),lineValue=$('lineValue'),weightValue=$('weightValue');

  let state={active:null,pages:{}};
  let range=null,ann=null,saveTimer=null;

  function id(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
  function fresh(name='새 페이지'){return{id:id(),title:name,html:'<p></p>',videoUrl:'',themeBottomText:'#AD1A72',themeBottomBg:'#F4DFEB',themeTopText:'#6940A5',themeTopBg:'#EAE4F2',body:16,line:2.5,titleSize:38,weight:700}}
  function load(){
    try{
      const currentData=localStorage.getItem(KEY);
      if(currentData){
        state=JSON.parse(currentData)||state;
      }else{
        const previousData=
          localStorage.getItem('simple-note-clean-v50') ||
          localStorage.getItem('simple-note-clean-v49') ||
          localStorage.getItem('simple-note-clean-v48') ||
          localStorage.getItem('simple-note-clean-v47') ||
          localStorage.getItem('simple-note-clean-v46') ||
          localStorage.getItem('simple-note-clean-v45') ||
          localStorage.getItem('simple-note-clean-v44') ||
          localStorage.getItem('simple-note-clean-v43') ||
          localStorage.getItem('simple-note-clean-v42') ||
          localStorage.getItem('simple-note-clean-v41') ||
          localStorage.getItem('simple-note-clean-v40') ||
          localStorage.getItem('simple-note-clean-v39') ||
          localStorage.getItem('simple-note-clean-v38') ||
          localStorage.getItem('simple-note-clean-v37') ||
          localStorage.getItem('simple-note-clean-v36') ||
          localStorage.getItem('simple-note-clean-v35') ||
          localStorage.getItem('simple-note-clean-v34') ||
          localStorage.getItem('simple-note-clean-v33') ||
          localStorage.getItem('simple-note-clean-v32') ||
          localStorage.getItem('simple-note-clean-v31') ||
          localStorage.getItem('simple-note-clean-v30') ||
          localStorage.getItem('simple-note-clean-v29') ||
          localStorage.getItem('simple-note-clean-v28') ||
          localStorage.getItem('simple-note-clean-v27') ||
          localStorage.getItem('simple-note-clean-v26_2') ||
          localStorage.getItem('simple-note-clean-v26');
        if(previousData){
          state=JSON.parse(previousData)||state;
          Object.values(state.pages||{}).forEach(p=>{
            if(Number(p.line)===1.8 || !p.line) p.line=2.5;
            if(!p.themeBottomText){
              const c=COLORS.find(x=>x[1]===(p.themeBottom||p.theme));
              p.themeBottomText=c?c[1]:'#AD1A72';
              p.themeBottomBg=c?c[2]:'#F4DFEB';
            }
            if(!p.themeTopText){
              const c=COLORS.find(x=>x[1]===(p.themeTop||p.theme));
              p.themeTopText=c?c[1]:'#6940A5';
              p.themeTopBg=c?c[2]:'#EAE4F2';
            }
            if(typeof p.videoUrl!=='string') p.videoUrl='';
          });
        }
      }
    }catch(e){}
    if(!state.active||!state.pages[state.active]){
      const p=fresh('첫 페이지');state.pages[p.id]=p;state.active=p.id;
    }
    persist();
  }
  function persist(){localStorage.setItem(KEY,JSON.stringify(state))}
  function current(){return state.pages[state.active]}
  function schedule(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveCurrent();persist()},200)}
  function saveCurrent(){
    const p=current();if(!p)return;
    p.title=title.textContent.trim()||'제목 없음';
    p.html=editor.innerHTML;
    p.themeBottomText=getComputedStyle(paper).getPropertyValue('--theme-bottom-text').trim()||'#AD1A72';
    p.themeBottomBg=getComputedStyle(paper).getPropertyValue('--theme-bottom-bg').trim()||'#F4DFEB';
    p.themeTopText=getComputedStyle(paper).getPropertyValue('--theme-top-text').trim()||'#6940A5';
    p.themeTopBg=getComputedStyle(paper).getPropertyValue('--theme-top-bg').trim()||'#EAE4F2';
    p.body=Number(bodySize.value)||16;
    p.titleSize=Number(titleSize.value)||38;
  }
  function renderPages(){
    pages.innerHTML='';
    Object.values(state.pages).forEach(p=>{
      const d=document.createElement('div');d.className='page'+(p.id===state.active?' active':'');
      const label=document.createElement('span');label.className='page-title-label';label.textContent=p.title;d.appendChild(label);
      d.onclick=()=>switchPage(p.id);d.ondblclick=()=>renamePage(p.id);pages.appendChild(d);
    });
  }

  function parseTimeToSeconds(value){
    if(!value)return 0;
    if(/^\d+$/.test(value)) return Number(value);
    const h=(value.match(/(\d+)h/)||[])[1]||0;
    const m=(value.match(/(\d+)m/)||[])[1]||0;
    const s=(value.match(/(\d+)s/)||[])[1]||0;
    return Number(h)*3600+Number(m)*60+Number(s);
  }

  function parseYouTubeUrl(raw){
    if(!raw)return null;
    let url;
    try{
      url=new URL(raw.trim());
    }catch(e){
      try{url=new URL('https://'+raw.trim())}catch(_){return null}
    }

    const host=url.hostname.replace(/^www\./,'').replace(/^m\./,'');
    let id='';

    if(host==='youtu.be'){
      id=url.pathname.split('/').filter(Boolean)[0]||'';
    }else if(host==='youtube.com' || host==='music.youtube.com'){
      if(url.pathname==='/watch'){
        id=url.searchParams.get('v')||'';
      }else{
        const parts=url.pathname.split('/').filter(Boolean);
        if(['embed','shorts','live'].includes(parts[0])) id=parts[1]||'';
      }
    }else{
      return null;
    }

    id=id.replace(/[^A-Za-z0-9_-]/g,'');
    if(!id)return null;

    const timeValue=url.searchParams.get('t') || url.searchParams.get('start') || '';
    const start=parseTimeToSeconds(timeValue);

    return {id,start};
  }

  function renderVideo(){
    const p=current();
    const parsed=parseYouTubeUrl(p?.videoUrl||'');

    if(!parsed){
      youtubePlayer.src='';
      youtubePlayer.dataset.videoSrc='';
      youtubeOpenLink.href='#';
      videoPanel.classList.remove('show');
      workspace.classList.remove('has-video');
      mainArea.classList.remove('has-video');
      requestAnimationFrame(()=>layoutAnnotations());
      return;
    }

    let src='https://www.youtube.com/embed/'+encodeURIComponent(parsed.id)+'?rel=0';
    if(parsed.start>0) src+='&start='+parsed.start;

    if(youtubePlayer.dataset.videoSrc!==src){
      youtubePlayer.src=src;
      youtubePlayer.dataset.videoSrc=src;
    }
    youtubeOpenLink.href=p.videoUrl||('https://www.youtube.com/watch?v='+parsed.id);
    videoPanel.classList.add('show');
    workspace.classList.add('has-video');
    mainArea.classList.add('has-video');
    requestAnimationFrame(()=>layoutAnnotations());
  }

  function apply(p){
    title.textContent=p.title==='제목 없음'?'':p.title;
    editor.innerHTML=p.html||'<p></p>';
    if(!p.themeBottomText){
      const old=COLORS.find(x=>x[1]===(p.themeBottom||p.theme));
      p.themeBottomText=old?old[1]:'#AD1A72';
      p.themeBottomBg=old?old[2]:'#F4DFEB';
    }
    if(!p.themeBottomBg){
      const c=COLORS.find(x=>x[1]===p.themeBottomText);
      p.themeBottomBg=c?c[2]:'#F4DFEB';
    }
    if(!p.themeTopText){
      const old=COLORS.find(x=>x[1]===(p.themeTop||p.theme));
      p.themeTopText=old?old[1]:'#6940A5';
      p.themeTopBg=old?old[2]:'#EAE4F2';
    }
    if(!p.themeTopBg){
      const c=COLORS.find(x=>x[1]===p.themeTopText);
      p.themeTopBg=c?c[2]:'#EAE4F2';
    }
    paper.style.setProperty('--theme-bottom-text',p.themeBottomText);
    paper.style.setProperty('--theme-bottom-bg',p.themeBottomBg);
    paper.style.setProperty('--theme-top-text',p.themeTopText);
    paper.style.setProperty('--theme-top-bg',p.themeTopBg);
    paper.style.setProperty('--body-size',p.body+'px');
    paper.style.setProperty('--line-height',p.line);
    paper.style.setProperty('--title-size',p.titleSize+'px');
    paper.style.setProperty('--title-weight',p.weight);
    bodySize.value=p.body;titleSize.value=p.titleSize;
    lineValue.textContent=LINE.find(x=>Number(x[0])===Number(p.line))?.[1]||'기본';
    weightValue.textContent=WEIGHT.find(x=>Number(x[0])===Number(p.weight))?.[1]||'굵게';
    const cb=COLORS.find(x=>x[1]===p.themeBottomText)||COLORS[4];
    const ct=COLORS.find(x=>x[1]===p.themeTopText)||COLORS[6];
    bottomThemeChip.style.background=cb[2];
    topThemeChip.style.background=ct[2];
    buildPops();
    renderVideo();
    layoutAnnotations();
  }
  function switchPage(pid){if(pid===state.active)return;saveCurrent();persist();state.active=pid;apply(current());renderPages();persist()}
  function renamePage(pid=state.active){const p=state.pages[pid];const n=prompt('페이지 이름 변경',p.title);if(n&&n.trim()){p.title=n.trim();if(pid===state.active)title.textContent=p.title;renderPages();persist()}}
  function createPage(){saveCurrent();const n=prompt('새 페이지 이름','새 페이지');if(!n||!n.trim())return;const p=fresh(n.trim());state.pages[p.id]=p;state.active=p.id;apply(p);renderPages();persist()}
  function removePage(){
    const p=current();if(!confirm('"'+p.title+'" 페이지를 삭제할까요?'))return;
    delete state.pages[state.active];
    let ids=Object.keys(state.pages);
    if(!ids.length){const q=fresh('새 페이지');state.pages[q.id]=q;ids=[q.id]}
    state.active=ids[0];apply(current());renderPages();persist();
  }

  function buildPops(){
    const p=current();
    bottomThemePop.innerHTML='';
    COLORS.forEach(c=>{
      const b=document.createElement('button');b.className='option'+(c[1]===p.themeBottomText?' active':'');
      const chip=document.createElement('span');chip.className='chip';chip.style.background=c[2];
      const t=document.createElement('span');t.textContent=c[0];t.style.color=c[1];b.append(chip,t);
      b.onclick=e=>{
        e.stopPropagation();
        p.themeBottomText=c[1];p.themeBottomBg=c[2];
        paper.style.setProperty('--theme-bottom-text',c[1]);
        paper.style.setProperty('--theme-bottom-bg',c[2]);
        bottomThemeChip.style.background=c[2];
        closePops();buildPops();persist()
      };
      bottomThemePop.appendChild(b);
    });

    topThemePop.innerHTML='';
    COLORS.forEach(c=>{
      const b=document.createElement('button');b.className='option'+(c[1]===p.themeTopText?' active':'');
      const chip=document.createElement('span');chip.className='chip';chip.style.background=c[2];
      const t=document.createElement('span');t.textContent=c[0];t.style.color=c[1];b.append(chip,t);
      b.onclick=e=>{
        e.stopPropagation();
        p.themeTopText=c[1];p.themeTopBg=c[2];
        paper.style.setProperty('--theme-top-text',c[1]);
        paper.style.setProperty('--theme-top-bg',c[2]);
        topThemeChip.style.background=c[2];
        closePops();buildPops();persist()
      };
      topThemePop.appendChild(b);
    });

    linePop.innerHTML='';
    LINE.forEach(o=>{
      const b=document.createElement('button');b.className='option'+(Number(o[0])===Number(p.line)?' active':'');b.textContent=o[1];
      b.onclick=e=>{e.stopPropagation();p.line=o[0];paper.style.setProperty('--line-height',o[0]);lineValue.textContent=o[1];closePops();buildPops();persist()};
      linePop.appendChild(b);
    });
    weightPop.innerHTML='';
    WEIGHT.forEach(o=>{
      const b=document.createElement('button');b.className='option'+(Number(o[0])===Number(p.weight)?' active':'');b.textContent=o[1];
      b.onclick=e=>{e.stopPropagation();p.weight=o[0];paper.style.setProperty('--title-weight',o[0]);weightValue.textContent=o[1];closePops();buildPops();persist()};
      weightPop.appendChild(b);
    });
  }
  function closePops(){bottomThemePop.classList.remove('show');topThemePop.classList.remove('show');linePop.classList.remove('show');weightPop.classList.remove('show')}
  function togglePop(pop){const open=pop.classList.contains('show');closePops();if(!open)pop.classList.add('show')}

  function selectionRange(){
    const s=window.getSelection();if(!s||!s.rangeCount||s.isCollapsed)return null;
    const r=s.getRangeAt(0);if(!editor.contains(r.commonAncestorContainer))return null;return r.cloneRange();
  }
  function selectAnn(a){document.querySelectorAll('.annotation.selected').forEach(x=>x.classList.remove('selected'));ann=a;if(a)a.classList.add('selected')}

  function intervalsOverlap(a,b,pad=8){
    return !(a.right + pad <= b.left || b.right + pad <= a.left);
  }

  function layoutAnnotations(){
    const annotations=[...editor.querySelectorAll('.annotation')];
    if(!annotations.length)return;

    /* 항상 아래를 기본값으로 시작 + 이전 가로 보정 초기화 */
    annotations.forEach(a=>{
      a.classList.remove('note-above');
      a.style.setProperty('--note-shift','0px');
    });

    /*
      실제 설명 박스끼리 충돌한 뒤 판단하는 대신,
      각 설명의 '예상 가로 영역'을 먼저 계산한다.
      따라서 서로 붙어 있는 단어에서도 안정적으로 위/아래가 갈린다.
    */
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        const rows=[];

        annotations.forEach(a=>{
          const text=a.querySelector('.annotation-text');
          const note=a.querySelector('.annotation-note');
          if(!text||!note)return;

          const tr=text.getBoundingClientRect();

          /* 같은 줄 판정: 글자의 세로 중심이 비슷하면 같은 row */
          const centerY=tr.top + tr.height/2;
          let row=rows.find(r=>Math.abs(r.centerY-centerY) <= Math.max(6,tr.height*.55));

          if(!row){
            row={centerY,below:[],above:[]};
            rows.push(row);
          }

          /*
            scrollWidth는 실제 설명 문자열이 필요로 하는 폭.
            화면에서는 max-width 420px이므로 동일하게 제한.
          */
          const noteWidth=Math.min(
            420,
            Math.max(note.scrollWidth || 0, note.getBoundingClientRect().width || 0, 12)
          );
          const centerX=tr.left + tr.width/2;
          const projected={
            left:centerX-noteWidth/2,
            right:centerX+noteWidth/2
          };

          const hitBelow=row.below.some(x=>intervalsOverlap(projected,x,8));

          if(hitBelow){
            /*
              아래 lane과 겹치면 무조건 위 lane으로 이동.
              사용자가 설명을 많이 달지 않는 전제에서는 이 2-lane 방식이 가장 단순하고 안정적.
            */
            a.classList.add('note-above');
            row.above.push(projected);
          }else{
            row.below.push(projected);
          }
        });

        /*
          설명이 좌우 본문 여백 밖으로 나가면 안쪽으로 자동 이동.
          글씨 크기가 바뀌거나 줄바꿈 위치가 달라져도 매번 다시 계산한다.
        */
        const editorRect=editor.getBoundingClientRect();
        const inset=4;

        annotations.forEach(a=>{
          const note=a.querySelector('.annotation-note');
          if(!note)return;

          a.style.setProperty('--note-shift','0px');
          const r=note.getBoundingClientRect();
          let shift=0;

          if(r.left < editorRect.left + inset){
            shift += (editorRect.left + inset) - r.left;
          }
          if(r.right > editorRect.right - inset){
            shift -= r.right - (editorRect.right - inset);
          }

          a.style.setProperty('--note-shift',shift+'px');
        });
      });
    });
  }

  function openModal(a=null){
    ann=a;$('modalTitle').textContent=a?'설명 수정':'설명 추가';noteInput.value=a?(a.dataset.note||''):'';
    $('modalDelete').style.display=a?'inline-block':'none';overlay.classList.add('show');setTimeout(()=>noteInput.focus(),0)
  }
  function saveNote(){
    const n=noteInput.value.trim();if(!n)return alert('설명을 입력해 주세요.');
    if(ann){ann.dataset.note=n;ann.querySelector('.annotation-note').textContent=n;overlay.classList.remove('show');schedule();layoutAnnotations();return}
    if(!range)return alert('다시 단어를 드래그해 주세요.');
    const w=document.createElement('span');w.className='annotation';w.dataset.note=n;w.contentEditable='false';
    const t=document.createElement('span');t.className='annotation-text';t.appendChild(range.extractContents());
    const d=document.createElement('span');d.className='annotation-note';d.textContent=n;w.append(t,d);range.insertNode(w);
    w.parentNode.insertBefore(document.createTextNode('\u200B'),w.nextSibling);range=null;overlay.classList.remove('show');schedule();layoutAnnotations()
  }
  function deleteNote(){
    if(!ann)return;const t=ann.querySelector('.annotation-text'),f=document.createDocumentFragment();
    while(t.firstChild)f.appendChild(t.firstChild);ann.replaceWith(f);editor.normalize();ann=null;overlay.classList.remove('show');schedule();layoutAnnotations()
  }

  editor.oncontextmenu=e=>{
    e.preventDefault();const a=e.target.closest('.annotation');range=selectionRange();
    $('addNote').style.display='none';$('editNote').style.display='none';$('deleteNote').style.display='none';
    if(a){selectAnn(a);$('editNote').style.display='block';$('deleteNote').style.display='block'}
    else if(range){ann=null;$('addNote').style.display='block'}else{return}
    ctx.style.display='block';ctx.style.left=Math.min(e.clientX,window.innerWidth-180)+'px';ctx.style.top=Math.min(e.clientY,window.innerHeight-120)+'px'
  };
  editor.onclick=e=>{const a=e.target.closest('.annotation');if(a)selectAnn(a);else selectAnn(null)};
  editor.ondblclick=e=>{const a=e.target.closest('.annotation');if(a){e.preventDefault();selectAnn(a);openModal(a)}};

  $('addNote').onclick=()=>{ctx.style.display='none';openModal(null)};
  $('editNote').onclick=()=>{ctx.style.display='none';if(ann)openModal(ann)};
  $('deleteNote').onclick=()=>{ctx.style.display='none';if(ann)deleteNote()};
  $('saveNote').onclick=saveNote;
  $('cancelNote').onclick=()=>overlay.classList.remove('show');
  $('modalDelete').onclick=deleteNote;

  noteInput.addEventListener('keydown',e=>{
    if(e.key==='Enter' && !e.isComposing){
      e.preventDefault();
      saveNote();
    }
  });
  overlay.onmousedown=e=>{if(e.target===overlay)overlay.classList.remove('show')};
  document.onmousedown=e=>{if(!ctx.contains(e.target))ctx.style.display='none'};



function openLinkModal(){
    saveCurrent();
    const p=current();
    linkInput.value=p.videoUrl||'';
    linkOverlay.classList.add('show');
    requestAnimationFrame(()=>{
      linkInput.focus();
      linkInput.select();
    });
  }

  function closeLinkModal(){
    linkOverlay.classList.remove('show');
  }

  function savePageLink(){
    const p=current();
    const value=linkInput.value.trim();

    if(value && !parseYouTubeUrl(value)){
      alert('올바른 YouTube 링크를 입력해주세요.');
      linkInput.focus();
      return;
    }

    p.videoUrl=value;
    persist();
    renderVideo();
    closeLinkModal();
  }

  linkBtn.onclick=openLinkModal;
  $('cancelLink').onclick=closeLinkModal;
  $('saveLink').onclick=savePageLink;

  linkInput.addEventListener('keydown',e=>{
    if(e.key==='Enter' && !e.isComposing){
      e.preventDefault();
      savePageLink();
    }
    if(e.key==='Escape'){
      e.preventDefault();
      closeLinkModal();
    }
  });

  linkOverlay.addEventListener('mousedown',e=>{
    if(e.target===linkOverlay) closeLinkModal();
  });

  $('settingsBtn').onclick=e=>{e.stopPropagation();settings.classList.toggle('show');closePops()};
  $('closeSettings').onclick=()=>settings.classList.remove('show');
  document.addEventListener('mousedown',e=>{if(!settings.contains(e.target)&&!$('settingsBtn').contains(e.target)){settings.classList.remove('show');closePops()}});
  $('bottomThemeRow').querySelector('.flat').onclick=e=>{e.stopPropagation();togglePop(bottomThemePop)};
  $('topThemeRow').querySelector('.flat').onclick=e=>{e.stopPropagation();togglePop(topThemePop)};
  $('lineRow').querySelector('.flat').onclick=e=>{e.stopPropagation();togglePop(linePop)};
  $('weightRow').querySelector('.flat').onclick=e=>{e.stopPropagation();togglePop(weightPop)};
  [bottomThemePop,topThemePop,linePop,weightPop].forEach(x=>x.onclick=e=>e.stopPropagation());

  document.querySelectorAll('.stepper button').forEach(b=>b.onclick=e=>{
    e.stopPropagation();const s=b.closest('.stepper'),inp=$(s.dataset.target),step=Number(b.dataset.step);
    inp.value=Math.max(Number(inp.min),Math.min(Number(inp.max),Number(inp.value)+step));
    if(inp.id==='bodySize'){current().body=Number(inp.value);paper.style.setProperty('--body-size',inp.value+'px');layoutAnnotations()}
    else{current().titleSize=Number(inp.value);paper.style.setProperty('--title-size',inp.value+'px')}
    persist()
  });
  bodySize.onchange=()=>{current().body=Math.max(8,Math.min(72,Number(bodySize.value)||16));bodySize.value=current().body;paper.style.setProperty('--body-size',current().body+'px');persist();layoutAnnotations()};
  titleSize.onchange=()=>{current().titleSize=Math.max(12,Math.min(120,Number(titleSize.value)||38));titleSize.value=current().titleSize;paper.style.setProperty('--title-size',current().titleSize+'px');persist()};
  bodySize.onclick=e=>e.stopPropagation();titleSize.onclick=e=>e.stopPropagation();

  function pastePlainText(e,target,isTitle){
    e.preventDefault();
    const text=(e.clipboardData||window.clipboardData).getData('text/plain');
    const clean=isTitle ? text.replace(/[\r\n]+/g,' ') : text;
    target.focus();
    /* 브라우저의 native undo stack을 최대한 사용 */
    if(document.queryCommandSupported && document.queryCommandSupported('insertText')){
      document.execCommand('insertText',false,clean);
    }else{
      const sel=window.getSelection();
      if(!sel||!sel.rangeCount)return;
      const r=sel.getRangeAt(0);
      r.deleteContents();
      r.insertNode(document.createTextNode(clean));
      r.collapse(false);
      sel.removeAllRanges();
      sel.addRange(r);
    }
  }

  title.addEventListener('paste',e=>pastePlainText(e,title,true));
  editor.addEventListener('paste',e=>pastePlainText(e,editor,false));

  title.oninput=()=>{current().title=title.textContent.trim()||'제목 없음';renderPages();schedule()};
  title.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();editor.focus()}};
  editor.oninput=()=>{schedule();layoutAnnotations()};
  window.addEventListener('resize',layoutAnnotations);

  $('newPage').onclick=createPage;$('rename').onclick=()=>renamePage();$('removePage').onclick=removePage;
  $('backup').onclick=()=>{saveCurrent();persist();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='my_notes_backup.json';a.click()};

  $('pdfBtn').onclick=()=>{saveCurrent();persist();window.print()};

  load();apply(current());renderPages();
  if(document.fonts && document.fonts.ready){
    document.fonts.ready.then(()=>layoutAnnotations());
  }
  setTimeout(layoutAnnotations,80);
  setTimeout(layoutAnnotations,250);
})();
</script>
